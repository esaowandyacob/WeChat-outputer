name: 运行问题
description: 安装失败、窗口打不开，或导出结果不对
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        不要贴 `keys.json`、数据库、导出文件或聊天正文。账号目录名打码即可。
  - type: dropdown
    id: os
    attributes:
      label: 系统
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python 版本
      description: 运行 `python --version` 的完整输出
      placeholder: Python 3.13.9
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 你运行的命令
      placeholder: |
        python -m venv .venv
        python -m pip install -r requirements-macos.txt
        python app.py
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 实际结果
      description: 终端原文或窗口上的提示。密钥打码。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 确认
      options:
        - label: 我没有粘贴密钥、数据库或聊天内容
          required: true
